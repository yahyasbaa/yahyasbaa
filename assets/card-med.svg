<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">
<defs>
  <pattern id="gridca" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#13202c" stroke-width="1"/>
  </pattern>
  <linearGradient id="scanca" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset=".5" stop-color="#22d3ee" stop-opacity=".07"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <filter id="glowca" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
<rect x="1" y="1" width="598" height="248" rx="14" fill="#070b10" stroke="#f43f5e" stroke-opacity=".35"/>
  <rect x="1" y="1" width="598" height="248" rx="14" fill="url(#gridca)" opacity=".55"/>
  <rect x="0" y="-80" width="600" height="80" fill="url(#scanca)">
    <animate attributeName="y" values="-80;250;250" keyTimes="0;.7;1" dur="6s" repeatCount="indefinite"/>
  </rect>
<rect x="1" y="1" width="6" height="248" rx="3" fill="#f43f5e"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></rect>
<text x="30" y="40" fill="#f43f5e" font-size="12" letter-spacing="2">PRJ-04 · FULL STACK + ML</text>
<text x="30" y="74" fill="#ffffff" font-size="25" font-weight="bold">MedPredict</text>
<text x="30" y="108" fill="#d6e2ee" font-size="14">Medical practice platform with an AI</text>
<text x="30" y="130" fill="#d6e2ee" font-size="14">diagnosis-assistance microservice.</text>
<text x="30" y="152" fill="#d6e2ee" font-size="14">React, Django REST, Flask, scikit-learn.</text>
<rect x="30" y="200" width="64.8" height="24" rx="5" fill="#f43f5e" fill-opacity=".12" stroke="#f43f5e" stroke-opacity=".5"/><text x="39" y="217" fill="#f43f5e" font-size="13">Django</text>
<rect x="102.8" y="200" width="57.0" height="24" rx="5" fill="#f43f5e" fill-opacity=".12" stroke="#f43f5e" stroke-opacity=".5"/><text x="111.8" y="217" fill="#f43f5e" font-size="13">React</text>
<rect x="167.8" y="200" width="33.6" height="24" rx="5" fill="#f43f5e" fill-opacity=".12" stroke="#f43f5e" stroke-opacity=".5"/><text x="176.8" y="217" fill="#f43f5e" font-size="13">ML</text>
<text x="576" y="40" text-anchor="end" fill="#5b6b7c" font-size="12">view repo →</text>
<g transform="translate(430,104)"><polyline points="0,40 30,40 40,40 48,22 56,58 64,8 72,52 80,40 120,40 128,32 136,40 160,40" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="320" stroke-dashoffset="320" filter="url(#glowca)"><animate attributeName="stroke-dashoffset" values="320;0;0;-320" keyTimes="0;.5;.7;1" dur="2.6s" repeatCount="indefinite"/></polyline><text x="0" y="86" fill="#5b6b7c" font-size="11">AI-assisted diagnosis</text></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">
<defs>
  <pattern id="gridca" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#13202c" stroke-width="1"/>
  </pattern>
  <linearGradient id="scanca" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset=".5" stop-color="#22d3ee" stop-opacity=".07"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <filter id="glowca" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
<rect x="1" y="1" width="598" height="248" rx="14" fill="#070b10" stroke="#a78bfa" stroke-opacity=".35"/>
  <rect x="1" y="1" width="598" height="248" rx="14" fill="url(#gridca)" opacity=".55"/>
  <rect x="0" y="-80" width="600" height="80" fill="url(#scanca)">
    <animate attributeName="y" values="-80;250;250" keyTimes="0;.7;1" dur="6s" repeatCount="indefinite"/>
  </rect>
<rect x="1" y="1" width="6" height="248" rx="3" fill="#a78bfa"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></rect>
<text x="30" y="40" fill="#a78bfa" font-size="12" letter-spacing="2">PRJ-03 · CLOUD SECURITY</text>
<text x="30" y="74" fill="#ffffff" font-size="20" font-weight="bold">secure-cloud-infrastructure</text>
<text x="30" y="108" fill="#d6e2ee" font-size="14">Three-tier AWS in Terraform: WAF, private EC2,</text>
<text x="30" y="130" fill="#d6e2ee" font-size="14">encrypted RDS, least-privilege IAM, 24 alarms,</text>
<text x="30" y="152" fill="#d6e2ee" font-size="14">policy-as-code and OIDC CI/CD.</text>
<rect x="30" y="200" width="88.2" height="24" rx="5" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="39" y="217" fill="#a78bfa" font-size="13">Terraform</text>
<rect x="126.2" y="200" width="41.4" height="24" rx="5" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="135.2" y="217" fill="#a78bfa" font-size="13">AWS</text>
<rect x="175.6" y="200" width="88.2" height="24" rx="5" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="184.6" y="217" fill="#a78bfa" font-size="13">DevSecOps</text>
<text x="576" y="40" text-anchor="end" fill="#5b6b7c" font-size="12">view repo →</text>
<g transform="translate(455,96)"><rect x="0" y="0" width="120" height="32" rx="6" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee"/><text x="60" y="21" text-anchor="middle" fill="#22d3ee" font-size="12">WAF · ALB</text><rect x="0" y="42" width="120" height="32" rx="6" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa"/><text x="60" y="63" text-anchor="middle" fill="#a78bfa" font-size="12">EC2 · private</text><line x1="60" y1="32" x2="60" y2="42" stroke="#5b6b7c" stroke-dasharray="2 3"><animate attributeName="stroke-dashoffset" from="5" to="0" dur=".6s" repeatCount="indefinite"/></line><rect x="0" y="84" width="120" height="32" rx="6" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24"/><text x="60" y="105" text-anchor="middle" fill="#fbbf24" font-size="12">RDS · KMS</text><line x1="60" y1="74" x2="60" y2="84" stroke="#5b6b7c" stroke-dasharray="2 3"><animate attributeName="stroke-dashoffset" from="5" to="0" dur=".6s" repeatCount="indefinite"/></line><g transform="translate(138,96)"><rect x="-9" y="0" width="18" height="15" rx="3" fill="#34d399"/><path d="M-5 0 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke="#34d399" stroke-width="2.5"/><circle r="14" cy="7" fill="none" stroke="#34d399"><animate attributeName="r" values="12;24" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle></g></g>
</svg>
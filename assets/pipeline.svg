<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">
<defs>
  <pattern id="gridp" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#13202c" stroke-width="1"/>
  </pattern>
  <linearGradient id="scanp" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset=".5" stop-color="#22d3ee" stop-opacity=".07"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <filter id="glowp" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
<rect x="1" y="1" width="1198" height="208" rx="14" fill="#070b10" stroke="#22d3ee" stroke-opacity=".35"/>
  <rect x="1" y="1" width="1198" height="208" rx="14" fill="url(#gridp)" opacity=".55"/>
  <rect x="0" y="-80" width="1200" height="80" fill="url(#scanp)">
    <animate attributeName="y" values="-80;210;210" keyTimes="0;.7;1" dur="6s" repeatCount="indefinite"/>
  </rect>
<text x="30" y="36" fill="#5b6b7c" font-size="13">// how every lab I build is wired — event in, verified alert out</text>
<path d="M110 118 L1090 118" stroke="#13202c" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M110 118 L1090 118" stroke="#22d3ee" stroke-opacity=".6" stroke-width="2" fill="none" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/></path>
<circle r="5" fill="#22d3ee" filter="url(#glowp)"><animateMotion path="M110 118 L1090 118" dur="4s" begin="0s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#a78bfa" filter="url(#glowp)"><animateMotion path="M110 118 L1090 118" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#fbbf24" filter="url(#glowp)"><animateMotion path="M110 118 L1090 118" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#f43f5e" filter="url(#glowp)"><animateMotion path="M110 118 L1090 118" dur="4s" begin="3s" repeatCount="indefinite"/></circle>

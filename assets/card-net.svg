<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">
<defs>
  <pattern id="gridca" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#13202c" stroke-width="1"/>
  </pattern>
  <linearGradient id="scanca" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset=".5" stop-color="#22d3ee" stop-opacity=".07"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <filter id="glowca" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
<rect x="1" y="1" width="598" height="248" rx="14" fill="#070b10" stroke="#34d399" stroke-opacity=".35"/>
  <rect x="1" y="1" width="598" height="248" rx="14" fill="url(#gridca)" opacity=".55"/>
  <rect x="0" y="-80" width="600" height="80" fill="url(#scanca)">
    <animate attributeName="y" values="-80;250;250" keyTimes="0;.7;1" dur="6s" repeatCount="indefinite"/>
  </rect>
<rect x="1" y="1" width="6" height="248" rx="3" fill="#34d399"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></rect>
<text x="30" y="40" fill="#34d399" font-size="12" letter-spacing="2">PRJ-02 · NETWORK DEFENSE</text>
<text x="30" y="74" fill="#ffffff" font-size="20" font-weight="bold">enterprise-network-security-lab</text>
<text x="30" y="108" fill="#d6e2ee" font-size="14">Five segmented zones behind a default-deny</text>
<text x="30" y="130" fill="#d6e2ee" font-size="14">nftables firewall with inline Suricata IPS.</text>
<text x="30" y="152" fill="#d6e2ee" font-size="14">Real traffic, live regression tests.</text>
<rect x="30" y="200" width="80.4" height="24" rx="5" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="39" y="217" fill="#34d399" font-size="13">nftables</text>
<rect x="118.4" y="200" width="80.4" height="24" rx="5" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="127.4" y="217" fill="#34d399" font-size="13">Suricata</text>
<rect x="206.8" y="200" width="57.0" height="24" rx="5" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="215.8" y="217" fill="#34d399" font-size="13">VLANs</text>
<text x="576" y="40" text-anchor="end" fill="#5b6b7c" font-size="12">view repo →</text>
<g transform="translate(410,84)"><rect x="96" y="0" width="64" height="36" rx="6" fill="none" stroke="#34d399"/><text x="128" y="23" text-anchor="middle" fill="#34d399" font-size="12">DMZ</text><line x1="44" y1="72" x2="96" y2="18" stroke="#34d399" stroke-opacity=".4"/><rect x="96" y="54" width="64" height="36" rx="6" fill="none" stroke="#22d3ee"/><text x="128" y="77" text-anchor="middle" fill="#22d3ee" font-size="12">SRV</text><line x1="44" y1="72" x2="96" y2="72" stroke="#22d3ee" stroke-opacity=".4"/><rect x="96" y="108" width="64" height="36" rx="6" fill="none" stroke="#a78bfa"/><text x="128" y="131" text-anchor="middle" fill="#a78bfa" font-size="12">MGT</text><line x1="44" y1="72" x2="96" y2="126" stroke="#a78bfa" stroke-opacity=".4"/><rect x="8" y="52" width="36" height="40" rx="6" fill="#f43f5e" fill-opacity=".15" stroke="#f43f5e"/><text x="26" y="77" text-anchor="middle" fill="#f43f5e" font-size="11">FW</text><circle r="4" fill="#34d399"><animateMotion path="M44 72 L96 18" dur="2s" repeatCount="indefinite"/></circle><circle r="4" fill="#22d3ee"><animateMotion path="M44 72 L96 72" dur="2s" begin=".7s" repeatCount="indefinite"/></circle><g><circle cx="-30" cy="72" r="4" fill="#f43f5e"><animate attributeName="cx" values="-30;6;6" keyTimes="0;.6;1" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.6;.7" dur="2.5s" repeatCount="indefinite"/></circle><text x="-26" y="118" fill="#f43f5e" font-size="11">DROP<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.6;.7;1" dur="2.5s" repeatCount="indefinite"/></text></g></g>
</svg>
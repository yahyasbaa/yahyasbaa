      <circle r="34" fill="none" stroke="#22d3ee" opacity=".5"><animate attributeName="r" values="34;44" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
      <text y="5" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="bold">02</text>
      <text y="62" text-anchor="middle" fill="#d6e2ee" font-size="14" font-weight="bold">COLLECT</text>
      <text y="80" text-anchor="middle" fill="#5b6b7c" font-size="12">agents</text></g>

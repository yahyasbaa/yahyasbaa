      <circle r="34" fill="#070b10" stroke="#22d3ee" stroke-width="2"/>
      <circle r="34" fill="none" stroke="#22d3ee" opacity=".5"><animate attributeName="r" values="34;44" dur="2.4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>
      <text y="5" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="bold">01</text>
      <text y="62" text-anchor="middle" fill="#d6e2ee" font-size="14" font-weight="bold">TELEMETRY</text>
      <text y="80" text-anchor="middle" fill="#5b6b7c" font-size="12">logs · events</text></g>
<g transform="translate(306,118)">

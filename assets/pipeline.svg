      <circle r="34" fill="#070b10" stroke="#34d399" stroke-width="2"/>
      <circle r="34" fill="none" stroke="#34d399" opacity=".5"><animate attributeName="r" values="34;44" dur="2.4s" begin="2.0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="2.4s" begin="2.0s" repeatCount="indefinite"/></circle>
      <text y="5" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">06</text>
      <text y="62" text-anchor="middle" fill="#d6e2ee" font-size="14" font-weight="bold">RESPOND</text>
      <text y="80" text-anchor="middle" fill="#5b6b7c" font-size="12">playbooks</text></g>

      <circle r="34" fill="none" stroke="#a78bfa" opacity=".5"><animate attributeName="r" values="34;44" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <text y="5" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold">03</text>
      <text y="62" text-anchor="middle" fill="#d6e2ee" font-size="14" font-weight="bold">PARSE</text>
      <text y="80" text-anchor="middle" fill="#5b6b7c" font-size="12">decoders</text></g>
<g transform="translate(698,118)">
      <circle r="34" fill="#070b10" stroke="#fbbf24" stroke-width="2"/>
      <circle r="34" fill="none" stroke="#fbbf24" opacity=".5"><animate attributeName="r" values="34;44" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text y="5" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">04</text>
      <text y="62" text-anchor="middle" fill="#d6e2ee" font-size="14" font-weight="bold">DETECT</text>
      <text y="80" text-anchor="middle" fill="#5b6b7c" font-size="12">rules · ATT&amp;CK</text></g>
<g transform="translate(894,118)">
      <circle r="34" fill="#070b10" stroke="#f43f5e" stroke-width="2"/>
      <circle r="34" fill="none" stroke="#f43f5e" opacity=".5"><animate attributeName="r" values="34;44" dur="2.4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
      <text y="5" text-anchor="middle" fill="#f43f5e" font-size="13" font-weight="bold">05</text>
      <text y="62" text-anchor="middle" fill="#d6e2ee" font-size="14" font-weight="bold">ALERT</text>
      <text y="80" text-anchor="middle" fill="#5b6b7c" font-size="12">severity</text></g>
